<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 06 - Table</title>
    <style>
        table {
            border-collapse: collapse; /* 讓雙線邊框合併為單一邊框 */
            width: 400px;
        }
        th, td {
            border: 1px solid black;   /* 黑色單線邊框 */
            padding: 8px 12px;         /* 內距留白 */
            text-align: left;          /* 文字靠左對齊 */
        }
        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Name</th>
            <th>Student ID</th>
        </tr>
        <tr>
            <td>張哲綸</td>
            <td>1143524</td>
        </tr>
    </table>

</body>
</html>
